# Local development stack for SentinelFlow (M3+).
# Start retrieval dependencies:
#   docker compose up -d postgres qdrant
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinelflow-postgres
    environment:
      POSTGRES_USER: sentinelflow
      POSTGRES_PASSWORD: sentinelflow
      POSTGRES_DB: sentinelflow
    ports:
      - "5433:5432"
    volumes:
      - sentinelflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelflow -d sentinelflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: sentinelflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - sentinelflow_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentinelflow_postgres_data:
    name: sentinelflow_postgres_data
  sentinelflow_qdrant_data:
    name: sentinelflow_qdrant_data
