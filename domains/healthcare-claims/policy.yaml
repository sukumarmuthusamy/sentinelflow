evidence_floor: 0.75
dependency_vuln_ceiling: high
decision_thresholds:
  pass_max: 40
  review_max: 70
risk_weights:
  blast_radius: 25
  critical_service: 20
  contract_break: 15
  security_severity: 15
  test_gap: 15
  incident_similarity: 10
  evidence_confidence_penalty: 10
overrides:
  - id: critical-contract-break
    condition: oasdiff_err_on_critical_service
    outcome: BLOCK
    description: Breaking contract change on a critical service forces BLOCK.
  - id: secret-exposure
    condition: verified_secret_in_diff
    outcome: BLOCK
    description: Verified secret exposure forces BLOCK.
  - id: weak-evidence
    condition: evidence_coverage_below_floor
    outcome: REVIEW
    description: Insufficient evidence coverage forces REVIEW.
  - id: unsupported-critical-claim
    condition: critical_claim_unsupported_after_repair
    outcome: REVIEW
    description: Unsupported critical assertions after repair forces REVIEW.
  - id: dependency-vuln-ceiling
    condition: dependency_vuln_at_or_above_ceiling
    outcome: BLOCK
    description: Dependency vulnerability at or above ceiling forces BLOCK.
allowed_agents:
  - change_analyst
  - evidence_investigator
  - test_strategist
  - security_auditor
  - evidence_verifier
default_plan:
  - change_analyst
  - evidence_investigator
  - test_strategist
  - security_auditor
  - evidence_verifier
category_agent_map:
  documentation:
    - change_analyst
    - evidence_investigator
    - evidence_verifier
  api_contract:
    - change_analyst
    - evidence_investigator
    - test_strategist
    - security_auditor
    - evidence_verifier
  auth_security:
    - change_analyst
    - evidence_investigator
    - test_strategist
    - security_auditor
    - evidence_verifier
